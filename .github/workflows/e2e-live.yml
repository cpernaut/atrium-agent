# Suite E2E contra el Supabase REAL (tests/live). Se corre a mano:
# GitHub → Actions → "E2E contra Supabase" → Run workflow.
#
# Crea dos usuarios temporales y obras «[E2E] …», verifica RLS, restricciones
# y registro cerrado, y borra todo al terminar (aunque algo falle).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY, E2E_SUPABASE_SERVICE_ROLE_KEY

name: E2E contra Supabase

on:
  workflow_dispatch:

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  live:
    name: Suite contra la base real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verificar secrets
        run: |
          for name in E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secret $name"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Correr tests/live
        run: pytest tests/live -m live -v -rs
        env:
          TEST_REPORT_TITLE: "E2E contra Supabase (base real)"
          TEST_REPORT_DIR: reporte
      - name: Guardar el reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e-supabase
          path: reporte/reporte-tests.html
          if-no-files-found: ignore

# Revisión automática de cada PR.
# 1) Corre tests y lint. 2) Si pasan, Claude revisa el diff y deja comentarios.
# Claude NUNCA aprueba ni mergea: eso queda en manos de una persona.
#
# Requiere el secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).

name: Revisión de Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests y lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  schema:
    name: Esquema y seguridad en Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar supabase_schema.sql y verificar RLS y restricciones
        run: tests/sql/run.sh

  review:
    name: Revisión de Claude
    needs: [checks, schema]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Revisá este pull request de Atrium Agent (Streamlit + LangGraph + Supabase).
            Escribí todo en español. Los tests y el lint ya pasaron.

            Prestá especial atención a:
            - supabase_schema.sql: cualquier DROP, cambio de columnas o política RLS
              que pueda borrar datos o exponerlos a usuarios no logueados.
            - Claves o secretos en el código (deben ir solo en Secrets de Streamlit).
            - Herramientas del agente que escriban en la base sin que el usuario lo pida.
            - Errores de lógica y tests que falten para el comportamiento nuevo.
            - Que las capas de atrium/ no importen Streamlit (ver README).

            Dejá comentarios inline en las líneas concretas con problemas y, al final,
            un único comentario de resumen con `gh pr comment` que diga si hay algo
            bloqueante. Si no encontrás problemas, decilo en una línea.
            No apruebes ni mergees el PR.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

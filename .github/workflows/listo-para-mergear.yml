# «Esquema aplicado»: check obligatorio del auto-merge.
#
# Mergear a main publica la app, pero supabase_schema.sql no se aplica solo. Si
# el PR cambia el esquema, este check falla hasta que alguien lo corra en
# Supabase y le ponga al PR la etiqueta «esquema aplicado». Si después llega un
# commit que vuelve a cambiar el esquema, la etiqueta se quita sola. Sin cambios
# de esquema, pasa enseguida. Lógica: .github/scripts/esquema_aplicado.py.

name: Listo para mergear

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

concurrency:
  group: listo-para-mergear-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  esquema:
    name: Esquema aplicado
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Verificar si el esquema está aplicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/esquema_aplicado.py

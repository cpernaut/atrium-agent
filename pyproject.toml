# Tooling config only. No [project] table on purpose: the app is deployed by
# installing requirements.txt, not as an installable package, and a stray
# [project] can confuse Streamlit Cloud's dependency detection.

[tool.ruff]
line-length = 100
# Runtime is Python 3.14 (CI and Streamlit Cloud). Ruff targets 3.13 so the code
# keeps running on 3.13 and `except (A, B):` isn't rewritten without parentheses.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# app.py must bridge st.secrets into the environment before the heavy imports.
"app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: corre contra el Supabase real (requiere E2E_SUPABASE_*; ver tests/live/conftest.py)",
]

# Tooling config only. No [project] table on purpose: the app is deployed by
# installing requirements.txt, not as an installable package, and a stray
# [project] can confuse Streamlit Cloud's dependency detection.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# app.py must bridge st.secrets into the environment before the heavy imports.
"app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

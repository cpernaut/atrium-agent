[project]
name = "atrium-agent"
version = "0.2.0"
description = "RAG assistant over Argentine building codes (LangGraph + Streamlit + Supabase)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# app.py must bridge st.secrets into the environment before the heavy imports.
"app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

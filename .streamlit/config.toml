# Look & feel of Atrium Studio. Light theme always: the floating agent panel and
# the brand colors are designed for it. primaryColor (slate) passes WCAG AA
# contrast on white for text and buttons (UX-08).
[theme]
base = "light"
primaryColor = "#3D5A73"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F7"
textColor = "#1F2933"
borderColor = "#D9DEE3"
showWidgetBorder = true
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"
